version: "3.1"

stories:
- story: greet_user_with_name
  steps:
    - intent: greet
    - action: action_greet_user

- story: goodbye_user
  steps:
    - intent: goodbye
    - action: utter_goodbye

- story: get_weather_story
  steps:
    - intent: get_weather
    - action: action_get_weather
    - action: utter_weather_result

- story: get_time_story
  steps:
    - intent: get_time
    - action: action_get_time
    - action: utter_time_result

- story: get_date_story
  steps:
    - intent: get_date
    - action: action_get_date
    - action: utter_date_result

- story: ask_question_story
  steps:
    - intent: ask_question
    - action: action_ask_question

- story: user_feeling_sad
  steps:
    - intent: user_feeling_sad
    - action: action_provide_emotional_support

- story: servo_control_story
  steps:
    - intent: servo_control
    - action: action_servo_control
    - action: utter_servo_confirmation

- story: turtle_info_story
  steps:
    - intent: ask_about_turtle
    - action: action_turtle_info
    - action: utter_turtle_info

- story: provide_user_info_story
  steps:
    - intent: provide_user_info
    - action: user_info_form
    - active_loop: user_info_form
    - slot_was_set:
      - name: "Alice"
    - active_loop: null
    - action: utter_acknowledge_info

- story: fallback_story
  steps:
    - intent: fallback
    - action: utter_fallback
