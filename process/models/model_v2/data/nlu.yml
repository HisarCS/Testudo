version: "3.1"

nlu:
  # -----------------------------------
  # 1) Greetings
  # -----------------------------------
  - intent: greet
    examples: |
      - hey
      - hello
      - hi
      - hello there
      - good morning
      - good evening
      - hey there
      - what's up
      - what is up
      - hi testudo
      - testudo hello
      - aloha
      - it's nice to see you
      - it is nice to see you
      - I'm glad to talk to you
      - I am glad to talk to you

  # -----------------------------------
  # 2) Goodbyes
  # -----------------------------------
  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - see you later
      - take care
      - farewell
      - I'm out
      - I am out
      - gotta go
      - I have to go
      - catch you later
      - talk soon

  # -----------------------------------
  # 3) Weather
  # -----------------------------------
  - intent: get_weather
    examples: |
      - what's the weather like
      - what is the weather like
      - what's the weather
      - what is the weather
      - is it going to rain
      - weather in [Istanbul](location)
      - tell me the weather in [London](location)
      - will it snow soon
      - how is the temperature outside
      - what is the weather forecast for tomorrow
      - what's the weather forecast for tomorrow
      - do I need an umbrella
      - will I need an umbrella

  # -----------------------------------
  # 4) Time
  # -----------------------------------
  - intent: get_time
    examples: |
      - what time is it
      - what's the time
      - current time please
      - can you tell me the time
      - do you know the time
      - time check
      - I need to know the time

  # -----------------------------------
  # 5) Date
  # -----------------------------------
  - intent: get_date
    examples: |
      - what is today's date
      - what's today's date
      - what is the date
      - what's the date
      - which day is it today
      - what day is it
      - date check

  # -----------------------------------
  # 6) General knowledge questions
  # -----------------------------------
  - intent: ask_question
    examples: |
      - what is a duck
      - what's a duck
      - what are ducks
      - who invented the telephone
      - what is the capital of France
      - what's the capital of France
      - who is the president of the United States
      - who's the president of the United States
      - who won the FIFA World Cup in 2018
      - who wrote "Romeo and Juliet"
      - what is the chemical formula for water
      - what's the chemical formula for water
      - who discovered gravity
      - what is the highest mountain in the world
      - what's the highest mountain in the world

  # -----------------------------------
  # 7) Ask about Turtle
  # -----------------------------------
  - intent: ask_about_turtle
    examples: |
      - what are you
      - tell me about yourself
      - how do you work
      - what is your purpose
      - what's your purpose
      - who created you
      - can you explain your features
      - why are you called Testudo

  # -----------------------------------
  # 8) Servo control
  # -----------------------------------
  - intent: servo_control
    examples: |
      - move forward
      - rotate left servo
      - turn right servo
      - move your head
      - walk around
      - move your front legs
      - can you adjust your legs

