version: "3.1"

intents:
  - greet
  - goodbye
  - apology
  - compliment
  - smalltalk_how_are_you
  - smalltalk_im_fine
  - smalltalk_weather_comment
  - smalltalk_morning_greeting
  - smalltalk_afternoon_greeting
  - smalltalk_evening_greeting
  - smalltalk_day_comment
  - smalltalk_night_comment
  - smalltalk_feelings_happy
  - smalltalk_feelings_sad
  - smalltalk_feelings_excited
  - smalltalk_feelings_bored
  - smalltalk_food_talk
  - smalltalk_music_talk
  - smalltalk_movie_talk
  - smalltalk_book_talk
  - smalltalk_sports_talk
  - smalltalk_hobby_talk
  - smalltalk_travel_talk
  - smalltalk_work_talk
  - smalltalk_family_talk
  - smalltalk_friend_talk
  - smalltalk_laugh
  - smalltalk_story_sharing
  - smalltalk_opinion_sharing
  - get_weather
  - get_time
  - get_date
  - ask_question
  - ask_about_turtle
  - servo_control
  - provide_user_info
  - user_feeling_sad
  - user_feeling_angry
  - user_feeling_happy
  - express_thanks
  - random_chitchat
  - ask_about_kit
  - ask_about_electronics
  - ask_about_3dprinting
  - ask_about_raspberry_pi
  - ask_about_ai
  - user_shares_personal_details
  - user_wants_joke
  - fallback

entities:
  - location
  - name
  - emotion
  - origin

slots:
  user_info:
    type: any
    influence_conversation: false
    mappings: []

responses:
  utter_greet:
    - text: "Hello!"

  utter_goodbye:
    - text: "Goodbye! Have a great day!"

  utter_fallback:
    - text: "I'm sorry, I didn't quite understand that."

  utter_weather_result:
    - text: "The weather in {location} is {weather_info}."

  utter_time_result:
    - text: "The current time is {time_info}."

  utter_date_result:
    - text: "Today's date is {date_info}."

  utter_question_answer:
    - text: "{answer}"

  utter_turtle_info:
    - text: "I am the Turtle bot, here to help with companionship, servo control, and more!"

  utter_servo_confirmation:
    - text: "Servo moved as requested."

  utter_acknowledge_info:
    - text: "Nice, I've noted that."

  utter_emotional_support:
    - text: "I'm here for you. It's okay to feel sad sometimes."

  utter_ask_name:
    - text: "What is your name?"

  utter_calming_message:
    - text: "I understand you feel upset. Take a deep breath. I'm here if you want to talk about it."

  utter_happy_response:
    - text: "That's wonderful! I'm glad you're feeling happy. How can I help you today?"

  utter_you_are_welcome:
    - text: "You're welcome! I'm happy to help."

  utter_random_chitchat:
    - text: "I'm doing well, thanks for asking! I'm here to chat, so feel free to ask me anything."

  utter_explain_kit:
    - text: >
        TESTUDO is an affordable, open-source robotics kit that you assemble. It includes a
        Raspberry Pi 4, servos, and 3D-printed parts. You can learn about AI, electronics,
        and coding while building it.

  utter_explain_electronics:
    - text: >
        My electronics include a Raspberry Pi 4 for main processing, a ReSpeaker 2-Mic Pi Hat
        for audio, and an Adafruit 16-Channel PWM servo driver controlling eight microservos.
        I also have a battery and voltage regulator to power everything.

  utter_explain_3dprinting:
    - text: >
        My shell is 3D printed using PLA. It usually takes around 2 hours depending on infill
        density and printer settings. The design can be customized, and magnets help attach
        the parts easily.

  utter_explain_raspberry_pi:
    - text: >
        I run on a Raspberry Pi 4 Model B, which handles the computations for my AI model,
        speech recognition, and servo control. It runs a Linux-based OS like Raspberry Pi OS.

  utter_explain_ai:
    - text: >
        I use a custom Rasa model for Natural Language Understanding and dialogue. It uses a
        transformer-based DIET Classifier, and can adapt based on your interactions.

  utter_joke:
    - text: >
        Here's one: Why did the robot cross the road?
        Because it was programmed by the chicken!
  utter_ask_about_data:
    - text: "Here's what I've collected about you: {user_info}."
  
  utter_apology:
    - text: "No worries, it's okay."
  utter_compliment:
    - text: "Thank you! I appreciate that."
  utter_how_are_you:
    - text: "I'm doing well, thank you for asking!"
  utter_im_fine:
    - text: "That's great to hear!"
  utter_weather_comment:
    - text: "The weather has been quite interesting today, hasn't it?"
  utter_morning_greeting:
    - text: "Good morning! Hope you have a wonderful day ahead."
  utter_afternoon_greeting:
    - text: "Good afternoon! How's your day going?"
  utter_evening_greeting:
    - text: "Good evening! How was your day?"
  utter_day_comment:
    - text: "Today seems to be a really nice day!"
  utter_night_comment:
    - text: "The night is so calm and peaceful."
  utter_feelings_happy:
    - text: "I'm glad you're feeling happy!"
  utter_feelings_sad:
    - text: "I'm sorry you're feeling down. I'm here if you need to talk."
  utter_feelings_excited:
    - text: "That's exciting! It's great to feel so enthusiastic."
  utter_feelings_bored:
    - text: "Boredom can be tough. Maybe try a new activity?"
  utter_food_talk:
    - text: "Food is such a wonderful topic! What cuisine do you like?"
  utter_music_talk:
    - text: "Music can lift the spirit. What's your favorite genre?"
  utter_movie_talk:
    - text: "Movies are a great escape. Have you seen any good ones lately?"
  utter_book_talk:
    - text: "Books open up new worlds. What are you reading at the moment?"
  utter_sports_talk:
    - text: "Sports keep us active! Do you have a favorite team?"
  utter_hobby_talk:
    - text: "Hobbies make life interesting. What do you enjoy doing in your free time?"
  utter_travel_talk:
    - text: "Travel broadens the mind. What's your favorite destination?"
  utter_work_talk:
    - text: "Work can be challenging, but rewarding too. How's your work going?"
  utter_family_talk:
    - text: "Family is important. How is your family doing?"
  utter_friend_talk:
    - text: "Friends bring joy to life. How are your friends?"
  utter_laugh:
    - text: "Haha, that's funny!"
  utter_story_sharing:
    - text: "I'd love to hear your story!"
  utter_opinion_sharing:
    - text: "I appreciate your perspective on that."

actions:
  - action_get_weather
  - action_get_time
  - action_get_date
  - action_extract_user_info
  - action_use_stored_data
  - action_ask_question
  - action_provide_emotional_support
  - action_servo_control
  - action_turtle_info

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
